name: CI

# Every push and pull request: each charger's own solution, built and tested on its own as it would be in a repository of
# its own, against the SDK's ChargerTestHub and a fake charger (Modbus TCP or HTTP). The images are built too, without
# pushing, so a broken Dockerfile shows here first.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: solax, project: Solax }
          - { name: huawei, project: Huawei }
          - { name: goe, project: GoE }
          - { name: shelly, project: Shelly }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test ${{ matrix.name }}
        run: dotnet test ${{ matrix.name }}/Gleanvolt.Plugin.${{ matrix.project }}.slnx -c Release

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: solax, project: Solax, section: Solax, port: 8098 }
          - { name: huawei, project: Huawei, section: Huawei, port: 8099 }
          - { name: goe, project: GoE, section: Goe, port: 8100 }
          - { name: shelly, project: Shelly, section: Shelly, port: 8097 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64 only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            PLUGIN=${{ matrix.project }}
            SECTION=${{ matrix.section }}
            PORT=${{ matrix.port }}
