name: CI

# Every push and pull request: build, and the tests, which run each plugin against the SDK's ChargerTestHub and a fake
# charger (Modbus TCP or HTTP). The images are built too, without pushing, so a broken Dockerfile shows here first.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Gleanvolt.Chargers.slnx -c Release
      - name: Test
        run: dotnet test Gleanvolt.Chargers.slnx -c Release --no-build

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: solax, project: Solax, section: Solax, port: 8098 }
          - { name: huawei, project: Huawei, section: Huawei, port: 8099 }
          - { name: goe, project: GoE, section: Goe, port: 8100 }
          - { name: shelly, project: Shelly, section: Shelly, port: 8097 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64 only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            PLUGIN=${{ matrix.project }}
            SECTION=${{ matrix.section }}
            PORT=${{ matrix.port }}
